version: '3'

volumes:
  static_value:
  media_value:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: galinafisher/foodgram-project-react-backend:latest
    env_file: .env
    volumes:
      - static_value:/backend_static
      - media_value:/app/media/
    depends_on:
      - db
  frontend:
    env_file: .env
    image: galinafisher/foodgram-project-react-frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_value:/frontend_static

  gateway:
    image: galinafisher/foodgram-project-react-gateway:latest
    env_file: .env
    volumes:
      - static_value:/staticfiles/
      - media_value:/media/
    depends_on:
      - frontend
    ports:
      - 8000:80
