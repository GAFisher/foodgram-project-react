version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    container_name: postgre_db
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    volumes:
      - static:/backend_static
      - media:/backend_media
    depends_on:
      - db
    env_file: .env

  frontend:
    build: ./frontend/
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
    depends_on:
      - db

  gateway:
    build: ./gateway/
    ports:
      - 8000:80
    volumes:
      - static:/staticfiles/
      - media:/backend_media/
